<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <style>
    .prompt { fill: url(#accent); font-weight: 700; }
    .you    { fill: #8b949e; }
    .text   { fill: #e6edf3; }
    .muted  { fill: #8b949e; }
    .tool   { fill: #bc8cff; font-weight: 700; }
    .ok     { fill: #3fb950; }
    .id     { fill: #d29922; }
    .hdr    { fill: #58a6ff; font-weight: 700; }
    .table  { fill: #c9d1d9; }
  </style>

  <!-- Window chrome -->
  <rect width="860" height="560" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="859" height="559" rx="12" fill="none" stroke="#30363d"/>
  <rect width="860" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="860" height="12" fill="#161b22"/>
  <circle cx="20" cy="18" r="6" fill="#f85149"/>
  <circle cx="40" cy="18" r="6" fill="#d29922"/>
  <circle cx="60" cy="18" r="6" fill="#3fb950"/>
  <text x="430" y="22" text-anchor="middle" font-size="12" fill="#8b949e">copilot — copilot-workspaces plugin</text>

  <!-- 1. user: list -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.3s" fill="freeze"/>
    <text x="24" y="74" font-size="13"><tspan class="prompt">›</tspan> <tspan class="you">you</tspan>  <tspan class="text">show me my workspaces</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.3s" fill="freeze"/>
    <text x="24" y="100" font-size="12"><tspan class="muted">⚙</tspan>  <tspan class="tool">workspaces_list</tspan> <tspan class="muted">()</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.7s" dur="0.3s" fill="freeze"/>
    <text x="40" y="122" font-size="12" class="muted">No workspaces yet. Create one with “create a workspace for &lt;name&gt;”.</text>
  </g>

  <!-- 2. create -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.3s" fill="freeze"/>
    <text x="24" y="158" font-size="13"><tspan class="prompt">›</tspan> <tspan class="you">you</tspan>  <tspan class="text">create a workspace for Microsoft</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="3.3s" dur="0.3s" fill="freeze"/>
    <text x="24" y="184" font-size="12"><tspan class="muted">⚙</tspan>  <tspan class="tool">workspaces_create</tspan> <tspan class="muted">(name=</tspan><tspan class="text">"Microsoft"</tspan><tspan class="muted">)</tspan></text>
    <text x="40" y="204" font-size="12"><tspan class="ok">✓</tspan> <tspan class="muted"> created workspace</tspan> <tspan class="text">Microsoft</tspan></text>
  </g>

  <!-- 3. assign current -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="4.4s" dur="0.3s" fill="freeze"/>
    <text x="24" y="240" font-size="13"><tspan class="prompt">›</tspan> <tspan class="you">you</tspan>  <tspan class="text">add this session to Microsoft</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="5.1s" dur="0.3s" fill="freeze"/>
    <text x="24" y="266" font-size="12"><tspan class="muted">⚙</tspan>  <tspan class="tool">workspaces_assign</tspan> <tspan class="muted">(name=</tspan><tspan class="text">"Microsoft"</tspan><tspan class="muted">)  // resolves current session</tspan></text>
    <text x="40" y="286" font-size="12"><tspan class="ok">✓</tspan> <tspan class="muted"> assigned</tspan> <tspan class="id">859b6fe</tspan> <tspan class="muted">→ Microsoft</tspan></text>
  </g>

  <!-- 4. show Microsoft -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="6.2s" dur="0.3s" fill="freeze"/>
    <text x="24" y="322" font-size="13"><tspan class="prompt">›</tspan> <tspan class="you">you</tspan>  <tspan class="text">show me the Microsoft workspace</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="6.9s" dur="0.3s" fill="freeze"/>
    <text x="24" y="346" font-size="12"><tspan class="muted">⚙</tspan>  <tspan class="tool">workspaces_show</tspan> <tspan class="muted">(name=</tspan><tspan class="text">"Microsoft"</tspan><tspan class="muted">)</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="7.4s" dur="0.4s" fill="freeze"/>
    <rect x="32" y="358" width="796" height="118" rx="6" fill="#0b0f14" stroke="#30363d"/>
    <text x="44" y="378" font-size="12">
      <tspan class="hdr">id</tspan><tspan class="muted">       </tspan><tspan class="hdr">name</tspan><tspan class="muted">                          </tspan><tspan class="hdr">last active</tspan><tspan class="muted">       </tspan><tspan class="hdr">checkpoint</tspan>
    </text>
    <line x1="44" y1="386" x2="816" y2="386" stroke="#30363d"/>
    <text x="44" y="406" font-size="12"><tspan class="id">859b6fe</tspan><tspan class="table">  Building copilot-workspaces MCP   2m ago            #001</tspan></text>
    <text x="44" y="426" font-size="12"><tspan class="id">a14c2d9</tspan><tspan class="table">  Microsoft onboarding deck              yesterday        #004</tspan></text>
    <text x="44" y="446" font-size="12"><tspan class="id">e702f31</tspan><tspan class="table">  Reviewing data residency clauses  3d ago           #002</tspan></text>
    <text x="44" y="466" font-size="12" class="muted">3 sessions · cwd C:\Users\joshbetts</text>
  </g>

  <!-- 5. resume -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="8.6s" dur="0.3s" fill="freeze"/>
    <text x="24" y="504" font-size="13"><tspan class="prompt">›</tspan> <tspan class="you">you</tspan>  <tspan class="text">resume a14c2d9 from Microsoft</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="9.2s" dur="0.3s" fill="freeze"/>
    <text x="24" y="528" font-size="12"><tspan class="muted">⚙</tspan>  <tspan class="tool">workspaces_resume</tspan> <tspan class="muted">→ run:</tspan> <tspan class="text">/resume a14c2d9…</tspan></text>
  </g>

  <!-- blinking caret -->
  <rect x="24" y="544" width="8" height="2" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- loop reset (fade to black, then SMIL restart) -->
  <rect width="860" height="560" fill="#0d1117" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.92;1" dur="12s" repeatCount="indefinite"/>
  </rect>
</svg>
